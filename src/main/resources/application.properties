spring.application.name=Flix
server.port=8081
spring.datasource.url=jdbc:postgresql://localhost:5432/movie_recc
spring.datasource.username=postgres
spring.datasource.password=melonmesk1606
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# CRITICAL: Prevent Spring AI from auto-creating a generic 'vector_store' table or looking for EmbeddingModel bean
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Optional local developer configuration (gitignored)
spring.config.import=optional:file:local.properties

# Gemini Embedding API Key (Can be overridden via local.properties or environment variable)
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}